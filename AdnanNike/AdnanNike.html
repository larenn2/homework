<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css" />
    <title>AdnanNike</title>
  </head>
  <body>
    <header class="header">
      <div class="container header__container">
     
        <nav class="menu header__menu">
             <button class="header_burger burger" title="menu" aria-label="menu">
          <svg width="40" height="12">
            <use class="header__burger-icon" href="./icons/burger.svg#burger"></use>
          </svg>
        </button>
          <ul class="menu__list">
            <li class="menu__item">
              <a href="#new-arrival" class="menu__link">new arrival</a>
            </li>
          </ul>
          <ul class="menu__list">
            <li class="menu__item">
              <a href="#men" class="menu__link">men</a>
            </li>
          </ul>
          <ul class="menu__list">
            <li class="menu__item">
              <a href="#women" class="menu__link">women</a>
            </li>
          </ul>
          <ul class="menu__list">
            <li class="menu__item">
              <a href="#kids" class="menu__link">kids</a>
            </li>
          </ul>
        </nav>
        <a class="logo header__logo" href="#">
          <img
            class="logo__png"
            src="./img/Logo.png"
            width="80"
            height="32"
            alt="Логотип Nike"
          />
        </a>
        <div class="header__controls">
          <div class="header__actions">
            <button
              class="header_actions-button"
              title="search"
              aria-label="search"
            >
              <svg width="18" height="18">
                <use
                  class="header__actions-icon"
                  href="./icons/search.svg#search"
                ></use>
              </svg>
            </button>
            <button
              class="header_actions-button"
              title="account"
              aria-label="account"
            >
              <svg width="16" height="16">
                <use
                  class="header__actions-icon"
                  href="./icons/account.svg#account"
                ></use>
              </svg>
            </button>
            <button class="header_actions-button" title="bag" aria-label="bag">
              <svg width="16" height="20">
                <use
                  class="header__actions-icon"
                  href="./icons/bag.svg#bag"
                ></use>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </header>
  </body>
</html>
